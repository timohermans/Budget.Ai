name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: registry.timo-hermans.nl
  IMAGE_NAME: budget-ai
  # Directory (relative to the Cluster repo root) containing the kustomization.yaml
  # that pins the budget-ai image.
  # TODO: adjust to the actual path in the Cluster repo.
  GITOPS_KUSTOMIZATION_DIR: k8s/budget-ai

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/dotnet:v1.61.0-noble
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore & build
        run: dotnet build Budget.slnx -c Release

      - name: Install dotnet-ef
        run: |
          dotnet tool install --global dotnet-ef
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Apply migrations
        env:
          BUDGET_DB_CONNECTION: "Host=postgres;Port=5432;Database=budget;Username=budget;Password=budget"
        run: dotnet ef database update --project src/Budget.Web --no-build --configuration Release

      - name: Unit tests
        run: dotnet test tests/Budget.Tests/Budget.Tests.csproj -c Release --no-build

      - name: Start web app
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ConnectionStrings__Budget: "Host=postgres;Port=5432;Database=budget;Username=budget;Password=budget"
        run: |
          dotnet run --project src/Budget.Web -c Release --no-build --urls http://localhost:5080 &
          echo $! > app.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://localhost:5080/; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start in time" >&2
          exit 1

      - name: E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5080
        run: dotnet test tests/Budget.E2e/Budget.E2e.csproj -c Release --no-build

      - name: Stop web app
        if: always()
        run: kill $(cat app.pid) 2>/dev/null || true

  build-image:
    name: Build & push image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: echo "version=$(date +'%Y-%m-%d')-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  update-gitops:
    name: Bump image in GitOps repo
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-image
    steps:
      - uses: actions/checkout@v4
        with:
          repository: timohermans/Cluster
          token: ${{ secrets.GITOPS_TOKEN }}

      - name: Install kustomize
        run: |
          curl -sSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          sudo mv kustomize /usr/local/bin/

      - name: Update image tag
        working-directory: ${{ env.GITOPS_KUSTOMIZATION_DIR }}
        run: kustomize edit set image ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-image.outputs.version }}

      - name: Commit & push
        run: |
          git config user.name "timo bot"
          git config user.email "noreply@timo.nl"
          git add .
          if git diff --cached --quiet; then
            echo "No version change to commit"
          else
            git commit -m "chore: bump budget-ai to ${{ needs.build-image.outputs.version }}"
            git push
          fi
