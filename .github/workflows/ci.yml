name: CI/CD

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  REGISTRY: images.timo-hermans.nl
  IMAGE_NAME: budget-ai
  # Directory (relative to the Cluster repo root) containing the kustomization.yaml
  # that pins the budget-ai image.
  # TODO: adjust to the actual path in the Cluster repo.
  GITOPS_KUSTOMIZATION_DIR: k8s/budget-ai

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: budget
          POSTGRES_PASSWORD: budget
          POSTGRES_DB: budget
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U budget"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://budget:budget@localhost:5432/budget
      BUDGET_DEBUG: "true"
      BUDGET_TEST_MODE: "true"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: src-django/pyproject.toml

      # The Playwright E2E suite is still the .NET project in tests/Budget.E2e.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Install dependencies
        working-directory: src-django
        run: pip install -e ".[dev]"

      - name: Lint
        working-directory: src-django
        run: ruff check config apps tests

      - name: Type check
        working-directory: src-django
        run: mypy config apps

      - name: Apply migrations
        working-directory: src-django
        run: python manage.py migrate

      - name: Django tests
        working-directory: src-django
        run: python manage.py test tests

      - name: Build E2E project
        run: dotnet build tests/Budget.E2e/Budget.E2e.csproj -c Release

      - name: Install Playwright browsers
        run: pwsh tests/Budget.E2e/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Start Django app
        working-directory: src-django
        run: |
          gunicorn config.wsgi:application --bind 127.0.0.1:5080 --workers 2 --access-logfile - &
          echo $! > app.pid
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:5080/health/ready; then
              echo "App is ready"
              exit 0
            fi
            sleep 2
          done
          echo "App failed to start in time" >&2
          exit 1

      - name: E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5080
        run: dotnet test tests/Budget.E2e/Budget.E2e.csproj -c Release --no-build

      - name: Stop Django app
        if: always()
        working-directory: src-django
        run: kill $(cat app.pid) 2>/dev/null || true

  build-image:
    name: Build & push image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute version
        id: version
        run: echo "version=$(date +'%Y.%m.%d').${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./src-django
          file: ./src-django/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
